[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "releases", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLR0915"]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM108", # ternaries are not clearer than short if/else blocks
    "B905",   # zip(strict=...) on every call is noise
]

[tool.ruff.lint.isort]
known-first-party = ["dms"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["default::pytest.PytestWarning"]

[tool.ruff.lint.per-file-ignores]
"tools/render_tabs.py" = ["E402"]  # environment and config patches must precede the Qt imports

[tool.mypy]
files = [
  "dms/processing.py",
  "dms/measurement_alignment.py",
  "dms/measurement_layout.py",
  "dms/hrtf.py",
  "dms/file_io.py",
  "dms/recovery.py",
  "dms/curator/",
  "dms/comparison.py",
  "dms/two_channel.py",
]
ignore_missing_imports = true
# Type-check imported dms modules, but report errors only in the files above.
follow_imports = "silent"
check_untyped_defs = false
warn_unused_ignores = true
