# Fully pinned build environment for FastGraph release builds.
#
# This is the exact dependency set the three build scripts install, so a build
# made today and a build made in six months produce the same binary contents.
# It covers requirements.txt, requirements-dev.txt, and PyInstaller.
#
# Regenerate after intentionally upgrading a dependency:
#
#   python -m venv .venv
#   .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
#   .venv/bin/python -m pip freeze > requirements.lock
#
# (Re-add this comment header afterwards; pip freeze does not preserve it.)
#
# Verified to have wheels for CPython 3.14 on win_amd64, macosx_11_0_arm64, and
# manylinux_2_28_x86_64. A few PyInstaller platform helpers (pefile,
# pywin32-ctypes on Windows) are resolved by pip and deliberately not pinned
# here, because they cannot be installed on the macOS/Linux runners.

